<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PatientLink — Facility Admin Dashboard</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/facility.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">PatientLink <small class="text-muted fw-normal fs-6">Facility Admin</small></span>
      <div class="d-flex align-items-center gap-3">
        <span class="text-white-50 small" id="navUserName"></span>
        <button class="btn btn-sm btn-outline-light" id="logoutBtn">Log out</button>
      </div>
    </div>
  </nav>

  <main class="container-fluid px-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Staff Management</h1>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createStaffModal">
        + Add Doctor
      </button>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Licence No</th>
              <th>Specialisation</th>
              <th>Status / Actions</th>
            </tr>
          </thead>
          <tbody id="staffTableBody">
            <tr><td colspan="5" class="text-center text-muted py-3">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Create Staff Modal -->
  <div class="modal fade" id="createStaffModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createStaffForm">
          <div class="modal-header">
            <h2 class="modal-title h5">Add Doctor Account</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div id="createAlert" class="alert alert-danger d-none py-2"></div>
            <div class="mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" id="staffName" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="staffEmail" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" id="staffPassword" required minlength="8" />
            </div>
            <div class="mb-3">
              <label class="form-label">Licence Number</label>
              <input type="text" class="form-control" id="staffLicence" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Specialisation</label>
              <input type="text" class="form-control" id="staffSpecialisation" placeholder="e.g. General Medicine" />
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" id="staffPhone" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="createBtn">Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
